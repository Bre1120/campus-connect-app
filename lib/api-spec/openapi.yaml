openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Campus Connect academic organization API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Student dashboard summaries
  - name: tasks
    description: Academic tasks
  - name: courses
    description: Student courses
  - name: profile
    description: Student profile and preferences
  - name: study-tools
    description: Flashcards, reviews, and AI study support
  - name: community
    description: Student and volunteer help conversations
  - name: study-sessions
    description: Logged study time
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      description: Returns the current student's daily tasks, upcoming deadlines, and completion progress.
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List academic tasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, completed]
            default: all
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [assignment, exam, project, reading, other]
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create an academic task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/import:
    post:
      operationId: importAgenda
      tags: [tasks]
      summary: Import reviewed agenda entries into the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaImportInput"
      responses:
        "200":
          description: Import completed atomically; matching entries are skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaImportResult"
        "400":
          description: Invalid import or course selection
        "401":
          description: Sign-in required
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /tasks/{id}/complete:
    patch:
      operationId: toggleTaskCompletion
      tags: [tasks]
      summary: Toggle task completion
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletionInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List student courses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{id}:
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Course deleted
        "404":
          description: Course not found
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get student profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /preferences:
    get:
      operationId: getPreferences
      tags: [profile]
      summary: Get reminder preferences
      responses:
        "200":
          description: Reminder preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
    patch:
      operationId: updatePreferences
      tags: [profile]
      summary: Update reminder preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated reminder preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
  /flashcard-decks:
    get:
      operationId: listFlashcardDecks
      tags: [study-tools]
      summary: List the student's flashcard decks
      responses:
        "200":
          description: Flashcard decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardDeck"
    post:
      operationId: createFlashcardDeck
      tags: [study-tools]
      summary: Create a flashcard deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckInput"
      responses:
        "201":
          description: Created flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckDetail"
  /flashcard-decks/{id}:
    get:
      operationId: getFlashcardDeck
      tags: [study-tools]
      summary: Get a flashcard deck and its cards
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckDetail"
        "404":
          description: Flashcard deck not found
    delete:
      operationId: deleteFlashcardDeck
      tags: [study-tools]
      summary: Delete a flashcard deck
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "204":
          description: Flashcard deck deleted
        "404":
          description: Flashcard deck not found
  /flashcards/{id}/confidence:
    patch:
      operationId: updateFlashcardConfidence
      tags: [study-tools]
      summary: Update a flashcard's review confidence
      parameters:
        - $ref: "#/components/parameters/FlashcardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardConfidenceUpdate"
      responses:
        "200":
          description: Updated flashcard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"
        "404":
          description: Flashcard not found
  /ai/study-assistant:
    post:
      operationId: askStudyAssistant
      tags: [study-tools]
      summary: Ask the personalized AI study assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyAssistantInput"
      responses:
        "200":
          description: Personalized study guidance and suggested flashcards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAssistantResponse"
  /community/messages:
    get:
      operationId: listCommunityMessages
      tags: [community]
      summary: Read messages in a community room
      parameters:
        - name: room
          in: query
          required: true
          schema:
            type: string
            enum: [students, help]
      responses:
        "200":
          description: Recent messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityMessage"
    post:
      operationId: createCommunityMessage
      tags: [community]
      summary: Send a message to a community room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMessage"
  /community/messages/{id}:
    delete:
      operationId: deleteCommunityMessage
      tags: [community]
      summary: Delete one of your own messages
      parameters:
        - $ref: "#/components/parameters/CommunityMessageId"
      responses:
        "204":
          description: Message deleted
        "404":
          description: Message not found
  /community/messages/{id}/report:
    post:
      operationId: reportCommunityMessage
      tags: [community]
      summary: Report another user's message
      parameters:
        - $ref: "#/components/parameters/CommunityMessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportReceipt"
  /study-sessions:
    get:
      operationId: listStudySessions
      tags: [study-sessions]
      summary: List the student's study sessions, newest first
      parameters:
        - name: from
          in: query
          required: false
          description: Only sessions studied on or after this calendar date
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySession"
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Log a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Logged study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "404":
          description: Course not found
  /study-sessions/{id}:
    delete:
      operationId: deleteStudySession
      tags: [study-sessions]
      summary: Delete a study session
      parameters:
        - $ref: "#/components/parameters/StudySessionId"
      responses:
        "204":
          description: Study session deleted
        "404":
          description: Study session not found
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    DeckId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    FlashcardId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CommunityMessageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    StudySessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    AgendaImportInput:
      type: object
      required: [course, tasks]
      properties:
        course:
          $ref: "#/components/schemas/AgendaImportCourse"
        tasks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgendaImportEntry"
    AgendaImportCourse:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 140
        courseId:
          type: [integer, "null"]
          minimum: 1
    AgendaImportEntry:
      type: object
      required: [title, type, dueDate, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        type:
          type: string
          enum: [assignment, exam, project, reading, other]
        dueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dueTime:
          type: [string, "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        priority:
          type: string
          enum: [low, medium, high]
        notes:
          type: [string, "null"]
          maxLength: 2000
    AgendaImportResult:
      type: object
      required: [insertedCount, skippedCount, courseId]
      properties:
        insertedCount:
          type: integer
        skippedCount:
          type: integer
        courseId:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Course:
      type: object
      required: [id, name, code, color]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        color:
          type: string
    CourseInput:
      type: object
      required: [name, code, color]
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
    CourseUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
    Task:
      type: object
      required: [id, title, courseId, courseName, courseCode, type, dueDate, priority, completed, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        courseId:
          type: integer
        courseName:
          type: string
        courseCode:
          type: string
        type:
          type: string
          enum: [assignment, exam, project, reading, other]
        dueDate:
          # A pattern, not format: date, so responses stay "YYYY-MM-DD" strings;
          # format: date is coerced to a Date and serialized as UTC midnight.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dueTime:
          type: [string, "null"]
        priority:
          type: string
          enum: [low, medium, high]
        completed:
          type: boolean
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      required: [title, courseId, type, dueDate, priority]
      properties:
        title:
          type: string
          minLength: 1
        courseId:
          type: integer
        type:
          type: string
          enum: [assignment, exam, project, reading, other]
        dueDate:
          type: string
          format: date
        dueTime:
          type: [string, "null"]
        priority:
          type: string
          enum: [low, medium, high]
        notes:
          type: [string, "null"]
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        courseId:
          type: integer
        type:
          type: string
          enum: [assignment, exam, project, reading, other]
        dueDate:
          type: string
          format: date
        dueTime:
          type: [string, "null"]
        priority:
          type: string
          enum: [low, medium, high]
        notes:
          type: [string, "null"]
        completed:
          type: boolean
    TaskCompletionInput:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
    Dashboard:
      type: object
      required: [todayTasks, upcomingTasks, completion]
      properties:
        todayTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        upcomingTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        completion:
          $ref: "#/components/schemas/CompletionSummary"
    CompletionSummary:
      type: object
      required: [completed, total, percentage, days]
      properties:
        completed:
          type: integer
        total:
          type: integer
        percentage:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/CompletionDay"
    CompletionDay:
      type: object
      required: [date, completed, total]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed:
          type: integer
        total:
          type: integer
    Profile:
      type: object
      required: [displayName, major, year]
      properties:
        displayName:
          type: string
        major:
          type: string
        year:
          type: string
    ProfileUpdate:
      type: object
      required: [displayName, major, year]
      properties:
        displayName:
          type: string
        major:
          type: string
        year:
          type: string
    Preferences:
      type: object
      required: [dailyFocus, deadlineReminders, weeklyReflection]
      properties:
        dailyFocus:
          type: boolean
        deadlineReminders:
          type: boolean
        weeklyReflection:
          type: boolean
    PreferencesUpdate:
      type: object
      required: [dailyFocus, deadlineReminders, weeklyReflection]
      properties:
        dailyFocus:
          type: boolean
        deadlineReminders:
          type: boolean
        weeklyReflection:
          type: boolean
    FlashcardDeck:
      type: object
      required: [id, title, description, cardCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        courseId:
          type: [integer, "null"]
        courseName:
          type: [string, "null"]
        cardCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    FlashcardDeckDetail:
      allOf:
        - $ref: "#/components/schemas/FlashcardDeck"
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              items:
                $ref: "#/components/schemas/Flashcard"
    Flashcard:
      type: object
      required: [id, deckId, front, back, confidence, createdAt]
      properties:
        id:
          type: integer
        deckId:
          type: integer
        front:
          type: string
        back:
          type: string
        confidence:
          type: string
          enum: [new, learning, mastered]
        createdAt:
          type: string
          format: date-time
    FlashcardDraft:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
          minLength: 1
        back:
          type: string
          minLength: 1
    FlashcardDeckInput:
      type: object
      required: [title, cards]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        courseId:
          type: [integer, "null"]
        cards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FlashcardDraft"
    FlashcardConfidenceUpdate:
      type: object
      required: [confidence]
      properties:
        confidence:
          type: string
          enum: [new, learning, mastered]
    StudyAssistantInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 12000
        courseId:
          type: [integer, "null"]
        history:
          type: array
          maxItems: 12
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 24000
    StudyAssistantResponse:
      type: object
      required: [answer, suggestedTitle, suggestedCards]
      properties:
        answer:
          type: string
          minLength: 1
        suggestedTitle:
          type: string
          minLength: 1
          maxLength: 140
        suggestedCards:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/FlashcardDraft"
    CommunityMessage:
      type: object
      required: [id, room, body, authorName, authorRole, isMine, createdAt]
      properties:
        id: { type: integer }
        room:
          type: string
          enum: [students, help]
        body: { type: string }
        authorName: { type: string }
        authorRole:
          type: string
          enum: [student, tutor, advisor]
        isMine: { type: boolean }
        createdAt:
          type: string
          format: date-time
    CommunityMessageInput:
      type: object
      required: [room, body, authorRole]
      properties:
        room:
          type: string
          enum: [students, help]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        authorRole:
          type: string
          enum: [student, tutor, advisor]
    CommunityReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [harassment, spam, unsafe, other]
    CommunityReportReceipt:
      type: object
      required: [received]
      properties:
        received: { type: boolean }
    StudySession:
      type: object
      required: [id, courseId, courseName, courseCode, courseColor, minutes, studiedOn, createdAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        courseName:
          type: string
        courseCode:
          type: string
        courseColor:
          type: string
        minutes:
          type: integer
        note:
          type: [string, "null"]
        studiedOn:
          # A pattern, not format: date, so it stays a "YYYY-MM-DD" string.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        createdAt:
          type: string
          format: date-time
    StudySessionInput:
      type: object
      required: [courseId, minutes, studiedOn]
      properties:
        courseId:
          type: integer
        minutes:
          type: integer
          minimum: 1
          maximum: 600
        note:
          type: [string, "null"]
          maxLength: 500
        studiedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
